steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Docker image'
    args: [
      'build',
      '--build-arg', 'REACT_APP_API_URL=${_REACT_APP_API_URL}',
      '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/express-earth/${_IMAGE_NAME}',
      '.'
    ]

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Docker image'
    args: [
      'push',
      '${_REGION}-docker.pkg.dev/${PROJECT_ID}/express-earth/${_IMAGE_NAME}'
    ]

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy to Cloud Run'
    entrypoint: 'gcloud'
    args: 
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/express-earth/${_IMAGE_NAME}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

substitutions:
  _IMAGE_NAME: 'express-earth-web-prod'
  _SERVICE_NAME: 'express-earth-web'
  _REGION: 'asia-south2'
  _REACT_APP_API_URL: 'https://api.expressearth.com'


images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/express-earth/${_IMAGE_NAME}'
  
options:
  logging: CLOUD_LOGGING_ONLY
