steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Docker image'
    args: [
      'build', 
      '-t', 'gcr.io/${PROJECT_ID}/${_IMAGE_NAME}',
      '.'
    ]

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Docker image'
    args: [
      'push',
      'gcr.io/${PROJECT_ID}/${_IMAGE_NAME}'
    ]

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy to Cloud Run'
    entrypoint: 'gcloud'
    args: 
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'gcr.io/${PROJECT_ID}/${_IMAGE_NAME}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - |
        REACT_APP_ENV=${_REACT_APP_ENV},
        NULL=${_NULL}
        

substitutions:
  _IMAGE_NAME: 'express-earth-web-prod'
  _SERVICE_NAME: 'express-earth-web'
  _REGION: 'asia-south2'
  _REACT_APP_ENV: ''


images:
  - 'gcr.io/${PROJECT_ID}/${_IMAGE_NAME}'
  
options:
  logging: CLOUD_LOGGING_ONLY
